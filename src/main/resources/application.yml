spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2 # 서울
      s3:
        bucket: ${AWS_S3_BUCKET}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_PASSWORD}
    base-url:
      join: ${SERVER_URL:http://localhost:8080}/api/auth/verify?token=
      email-change: ${SERVER_URL:http://localhost:8080}/api/users/email/verify?token=
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}
  redirect:
    auth-verify-success: ${SERVER_URL:http://localhost:8080}/signup?verified=true
    auth-verify-failed: ${SERVER_URL:http://localhost:8080}/signup?error=true
    email-verify-success: ${SERVER_URL:http://localhost:8080}/settings/email?verified=true
    email-verify-failed: ${SERVER_URL:http://localhost:8080}/settings/email?error=true

