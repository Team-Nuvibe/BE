spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2 # 서울
      s3:
        bucket: ${AWS_S3_BUCKET}
      sqs:
        queue:
          name: ${AWS_QUEUE_NAME}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_PASSWORD}
    base-url: ${SERVER_URL:http://localhost:8080}/api/auth/verify?token=
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}


# OAuth2 소셜 로그인 설정
oauth2:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${SERVER_URL}/api/auth/oauth2/callback/naver
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${SERVER_URL}/api/auth/oauth2/callback/kakao
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${SERVER_URL}/api/auth/oauth2/callback/google

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: nuvibe

logging:
  file:
    name: /logs/application.log

frontend:
  url: ${FRONT_URL:http://localhost:3000}
