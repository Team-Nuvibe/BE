# =========================================================
# 1. HTTP 서버 (80번 포트)
# 역할: Certbot 인증 트래픽 처리 & HTTPS로 강제 리다이렉트
# =========================================================
server {
    listen 80;
    server_name api.nuvibe.site nuvibe.site;

    # [필수] Certbot이 인증서 갱신 시 접근하는 경로 (지우면 갱신 안 됨)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # [보안] 나머지 모든 요청은 HTTPS로 301 Redirect (Permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================
# 2. HTTPS 서버 (443번 포트) - 메인 API
# 역할: 실제 비즈니스 로직 처리 (Spring Boot 프록시)
# =========================================================
server {
    listen 443 ssl;
    server_name api.nuvibe.site;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/api.nuvibe.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nuvibe.site/privkey.pem;

    # SSL 보안 강화 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 클라이언트 요청 크기 제한 (이미지 업로드 등 고려 15MB)
    client_max_body_size 15M;

    # 백엔드 연결
    location / {
        proxy_pass http://app:8080;

        # 실제 IP 전달을 위한 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정 (넉넉하게 60초)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 헬스체크 (로그 끄기)
    location /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        access_log off;
    }
}

# =========================================================
# 3. HTTPS 서버 (루트 도메인 nuvibe.site)
# 역할: 사용자가 www 없이 들어왔을 때 API 서버나 프론트로 넘겨줌
# =========================================================
server {
    listen 443 ssl;
    server_name nuvibe.site;

    # api.nuvibe.site와 동일한 인증서 사용 (SAN 인증서이므로 가능)
    ssl_certificate /etc/letsencrypt/live/api.nuvibe.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nuvibe.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 루트 도메인 접속 시 api 도메인으로 리다이렉트
    # (만약 프론트엔드 서버가 따로 있다면 여기서 프록시하거나 리다이렉트 주소 변경)
    location / {
        return 301 https://api.nuvibe.site$request_uri;
    }
}