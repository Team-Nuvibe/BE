name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  # CI, main과 dev로 pr 날리면 발생
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  # CD, main에 push하면 발생, 도커 이미지 생성 후 배포
  cd:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nuvibe:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY,AWS_S3_BUCKET,AWS_SECRET_KEY,DOCKERHUB_USERNAME,FRONT_URL,GMAIL_ADDRESS,GMAIL_PASSWORD,JWT_ACCESS_TOKEN_VALIDITY,JWT_REFRESH_TOKEN_VALIDITY,JWT_SECRET_KEY,PROD_DB_PASSWORD,PROD_DB_URL,PROD_DB_USERNAME,SERVER_URL
          script: |
            # 배포 디렉토리 생성
            mkdir -p /home/ubuntu/nuvibe
            cd /home/ubuntu/nuvibe

            # docker-compose.yml 생성
            cat << 'COMPOSE_EOF' > docker-compose.yml
            version: '3.8'

            services:
              app:
                image: ${DOCKERHUB_USERNAME}/nuvibe:latest
                container_name: nuvibe-app
                ports:
                  - "80:8080"
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  
                  # AWS 설정
                  - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
                  - AWS_S3_BUCKET=${AWS_S3_BUCKET}
                  - AWS_SECRET_KEY=${AWS_SECRET_KEY}
                  
                  # DB 설정
                  - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
                  - PROD_DB_URL=${PROD_DB_URL}
                  - PROD_DB_USERNAME=${PROD_DB_USERNAME}
                  
                  # JWT 설정
                  - JWT_ACCESS_TOKEN_VALIDITY=${JWT_ACCESS_TOKEN_VALIDITY}
                  - JWT_REFRESH_TOKEN_VALIDITY=${JWT_REFRESH_TOKEN_VALIDITY}
                  - JWT_SECRET_KEY=${JWT_SECRET_KEY}
                  
                  # 메일 설정
                  - GMAIL_ADDRESS=${GMAIL_ADDRESS}
                  - GMAIL_PASSWORD=${GMAIL_PASSWORD}
                  - SERVER_URL=${SERVER_URL}
                  
                  # Frontend 설정
                  - FRONT_URL=${FRONT_URL}
            
                restart: unless-stopped
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

            COMPOSE_EOF

            # 최신 이미지 Pull
            sudo -E docker pull ${DOCKERHUB_USERNAME}/nuvibe:latest

            # 기존 컨테이너 중지 및 재시작
            sudo -E docker compose down
            sudo -E docker compose up -d

            # 사용하지 않는 이미지 정리
            sudo docker image prune -f
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          FRONT_URL: ${{ secrets.FRONT_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          JWT_ACCESS_TOKEN_VALIDITY: ${{ secrets.JWT_ACCESS_TOKEN_VALIDITY }}
          JWT_REFRESH_TOKEN_VALIDITY: ${{ secrets.JWT_REFRESH_TOKEN_VALIDITY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PROD_DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
