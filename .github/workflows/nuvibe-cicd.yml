name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev

jobs:
  # CI, dev로 pr 날리면 발생
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

  # CD, main에 push하면 발생, 도커 이미지 생성 후 배포
  cd:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nuvibe:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,PROD_DB_URL,PROD_DB_USERNAME,PROD_DB_NAME,PROD_DB_PASSWORD
          script: |
            # 배포 디렉토리 생성
            mkdir -p /home/ubuntu/nuvibe
            cd /home/ubuntu/nuvibe

            # docker-compose.yml 생성
            cat << 'COMPOSE_EOF' > docker-compose.yml
            version: '3.8'

            services:
              app:
                image: ${DOCKERHUB_USERNAME}/nuvibe:latest
                container_name: nuvibe-app
                ports:
                  - "80:8080"
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - PROD_DB_URL=${PROD_DB_URL}
                  - PROD_DB_USERNAME=${PROD_DB_USERNAME}
                  - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - nuvibe-network
                restart: unless-stopped
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

              db:
                image: mysql:8.0
                container_name: nuvibe-db
                environment:
                  - MYSQL_ROOT_PASSWORD=${PROD_DB_PASSWORD}
                  - MYSQL_DATABASE=${PROD_DB_NAME}
                  - TZ=Asia/Seoul
                volumes:
                  - /home/ubuntu/nuvibe_data:/var/lib/mysql
                networks:
                  - nuvibe-network
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PROD_DB_PASSWORD}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 30s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

            networks:
              nuvibe-network:
                driver: bridge
            COMPOSE_EOF

            # 최신 이미지 Pull
            sudo -E docker pull ${DOCKERHUB_USERNAME}/nuvibe:latest

            # 기존 컨테이너 중지 및 재시작
            sudo -E docker compose down
            sudo -E docker compose up -d

            # 사용하지 않는 이미지 정리
            sudo docker image prune -f
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PROD_DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}