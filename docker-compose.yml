version: '3.8'

services:
  app:
    image: ${DOCKERHUB_USERNAME}/nuvibe:latest
    container_name: nuvibe-app
    ports:
      - "80:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PROD_DB_URL=${PROD_DB_URL}
      - PROD_DB_USERNAME=${PROD_DB_USERNAME}
      - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nuvibe-network
    restart: unless-stopped
    volumes:
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
